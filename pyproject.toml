[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iskander-ai-trade"
version = "0.2.0"
description = "Risk-first multi-symbol spot trading research and paper execution engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ccxt>=4.4,<5",
  "python-dotenv>=1.0,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "httpx>=0.27,<1"]

[project.scripts]
iskander-trade = "iskander_trade.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
