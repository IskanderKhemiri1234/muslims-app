services:
  - type: web
    name: iskander-ai-trade-free
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn iskander_trade.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: MODE
        value: paper
      - key: DASHBOARD_TOKEN
        generateValue: true
      - key: STATE_PATH
        value: /tmp/iskander_trade/paper_state.json
      - key: WATCHLIST
        value: BTC/USDT,ETH/USDT,BNB/USDT,SOL/USDT,XRP/USDT,ADA/USDT
      - key: TIMEFRAME
        value: 15m
      - key: VIRTUAL_CAPITAL_USDT
        value: "70"
      - key: RISK_PER_TRADE_USDT
        value: "0.35"
      - key: MAX_DAILY_LOSS_USDT
        value: "1.40"
      - key: MAX_OPEN_POSITIONS
        value: "3"
      - key: MAX_POSITION_NOTIONAL_USDT
        value: "20"
      - key: STOP_LOSS_PCT
        value: "2.0"
      - key: TAKE_PROFIT_PCT
        value: "4.0"
