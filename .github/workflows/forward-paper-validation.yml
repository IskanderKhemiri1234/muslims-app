name: Iskander Forward Locked Paper Validation

on:
  workflow_dispatch:
  push:
    branches: [research/portfolio-walkforward-v2]
    paths:
      - "scripts/run_forward_paper_validation.py"
      - "scripts/run_continuous_portfolio_research.py"
      - "tests/test_continuous_portfolio_research.py"
      - ".github/workflows/forward-paper-validation.yml"

permissions:
  contents: read

concurrency:
  group: iskander-forward-paper-validation
  cancel-in-progress: false

jobs:
  forward-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: research/portfolio-walkforward-v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify research engine
        run: |
          pytest -q tests/test_continuous_portfolio_research.py
          ruff check scripts/run_continuous_portfolio_research.py scripts/run_forward_paper_validation.py tests/test_continuous_portfolio_research.py
      - name: Replay prospective paper portfolio from fixed freeze date
        run: python scripts/run_forward_paper_validation.py
      - name: Publish cumulative forward paper report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iskander-forward-paper-validation
          path: reports/forward_paper_validation.json
          if-no-files-found: error
          retention-days: 90
