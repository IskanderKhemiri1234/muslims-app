name: Iskander AI Trade Android APK

concurrency:
  group: iskander-android-apk-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [deploy/infrlo-paper-v1]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build installable debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r android-app/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.iskander.aitrade/.MainActivity
            sleep 4
            adb shell pidof com.iskander.aitrade
            adb shell uiautomator dump /sdcard/window.xml
            adb shell cat /sdcard/window.xml | grep -q "ISKANDER AI TRADE"
      - uses: actions/upload-artifact@v4
        with:
          name: iskander-ai-trade-native-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
