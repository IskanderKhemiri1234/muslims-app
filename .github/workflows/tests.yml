name: Iskander AI Trade CI

on:
  push:
    branches: [main, foundation, deploy/infrlo-paper-v1, feature/binance-live-execution-v1, feature/binance-testnet-safety-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Lint
        run: ruff check src tests
      - name: Package isolated SillyDev Testnet deployment
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=iskander-ai-trade-testnet-v2/ HEAD -o dist/iskander-ai-trade-testnet-v2.zip
      - name: Upload SillyDev deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: iskander-ai-trade-testnet-v2
          path: dist/iskander-ai-trade-testnet-v2.zip
          if-no-files-found: error
          retention-days: 14
