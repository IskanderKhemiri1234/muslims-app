name: Iskander AI Trade CI

on:
  push:
    branches: [main, foundation, deploy/infrlo-paper-v1, feature/binance-live-execution-v1, feature/pro-dashboard-auth-v1]
  pull_request:
    branches: [main, feature/manual-live-safety-v2]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Lint
        run: ruff check src tests
