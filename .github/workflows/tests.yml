name: Iskander AI Trade CI

on:
  push:
    branches: [main, foundation, "feature/**"]
  pull_request:
    branches: [main, foundation]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Check lean API import memory
        run: python scripts/check_memory.py
      - name: Lint
        run: ruff check src tests scripts
