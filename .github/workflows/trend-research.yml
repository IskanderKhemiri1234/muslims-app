name: Iskander 4h Trend and Momentum Research

on:
  push:
    branches: [research/4h-trend-momentum]
    paths:
      - "scripts/run_trend_research.py"
      - "tests/test_trend_research.py"
      - ".github/workflows/trend-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trend-research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: research/4h-trend-momentum
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run research unit tests
        run: |
          pytest -q tests/test_trend_research.py
          ruff check scripts/run_trend_research.py tests/test_trend_research.py
      - name: Download public candles and run 4h research
        run: |
          python scripts/run_trend_research.py \
            --exchange okx \
            --since 2024-01-01 \
            --spread-values 0.05,0.10,0.15
      - name: Upload trend research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iskander-4h-trend-momentum-report
          path: reports/trend_4h_research.json
          if-no-files-found: warn
          retention-days: 30
