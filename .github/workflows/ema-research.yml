name: Iskander EMA Historical Research

on:
  push:
    branches: [feature/always-on-paper-engine]
    paths:
      - ".github/workflows/ema-research.yml"
      - "src/iskander_trade/backtest.py"
      - "src/iskander_trade/selection.py"
      - "scripts/run_backtest.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: feature/always-on-paper-engine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runner
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download public candles and run comparison
        run: |
          python scripts/run_backtest.py \
            --exchange gateio \
            --since 2024-01-01 \
            --holdout-days 90 \
            --walk-forward-days 30 \
            --warmup-days 180 \
            --fee-rate 0.001 \
            --slippage-rate 0.0005 \
            --assumed-spread-pct 0.05
      - name: Upload EMA research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iskander-ema-walk-forward-holdout
          path: reports/ema_backtest_report.json
          if-no-files-found: warn
          retention-days: 30
